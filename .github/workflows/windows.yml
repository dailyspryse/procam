name: Windows Studio

on:
  push:
    paths:
      - "Windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: microsoft/setup-msbuild@v2

      # ── Virtual camera: softcam, renamed so it shows up as "ProCam iPhone"
      #    and never collides with another softcam-based app.
      - name: Build virtual camera (softcam)
        run: |
          git clone --depth 1 --branch v1.8.1 https://github.com/tshino/softcam.git softcam
          $cpp = "softcam/src/softcam/softcam.cpp"
          (Get-Content $cpp -Raw) `
            -replace 'L"DirectShow Softcam"', 'L"ProCam iPhone"' `
            -replace '0xaef3b972, 0x5fa5, 0x4647, 0x95, 0x71, 0x35, 0x8e, 0xb4, 0x72, 0xbc, 0x9e', '0x5b0e1d52, 0x8c7a, 0x4e2b, 0x9f, 0x3d, 0x7a, 0x61, 0xc2, 0xb8, 0x4e, 0x19' `
            | Set-Content $cpp
          $fb = "softcam/src/softcamcore/FrameBuffer.cpp"
          (Get-Content $fb -Raw) -replace '"DirectShow Softcam/', '"ProCam iPhone/' | Set-Content $fb
          Select-String -Path $cpp -Pattern 'ProCam iPhone','0x5b0e1d52' | ForEach-Object { $_.Line }
          if ((Select-String -Path $cpp -Pattern '0x5b0e1d52').Count -eq 0) { throw "GUID-Patch fehlgeschlagen" }
          msbuild softcam/softcam.sln /t:softcam /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          Get-ChildItem softcam/dist/bin/x64

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build Media Foundation camera (Windows 11)
        run: |
          nuget restore Windows/VirtualCamera/Source/packages.config -PackagesDirectory Windows/VirtualCamera/packages
          msbuild Windows/VirtualCamera/Source/VCamSampleSource.vcxproj /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:SolutionDir="$PWD\Windows\VirtualCamera\" /m /v:minimal
          $dll = Get-ChildItem -Recurse Windows/VirtualCamera -Filter VCamSampleSource.dll | Select-Object -First 1
          if (-not $dll) { throw "Media Source nicht gebaut" }
          New-Item -ItemType Directory -Force mfcam | Out-Null
          Copy-Item $dll.FullName mfcam/procam_mfcam.dll
          cl /nologo /EHsc /MT /O2 Windows/VirtualCamera/vcamctl.cpp /Fe:mfcam/procam_vcamctl.exe
          dumpbin /dependents mfcam/procam_mfcam.dll | Select-String "\.dll"

      - name: Fetch FFmpeg 9.0 (LGPL, shared)
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Directory -Filter bin | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force ffmpeg-bin | Out-Null
          Copy-Item "$bin/*" ffmpeg-bin/
          Get-ChildItem ffmpeg-bin

      - name: Build ProCam Studio
        run: |
          dotnet publish Windows/ProCamStudio/ProCamStudio.csproj -c Release -o publish
          New-Item -ItemType Directory -Force publish/ffmpeg | Out-Null
          Copy-Item ffmpeg-bin/*.dll publish/ffmpeg/
          Copy-Item softcam/dist/bin/x64/softcam.dll publish/procam_vcam.dll
          Copy-Item mfcam/* publish/
          Copy-Item Windows/README-Windows.txt publish/LIESMICH.txt

      - name: Self-test (protocol + decoding)
        run: |
          Copy-Item -Recurse Windows/testdata publish/testdata
          $p = Start-Process -FilePath publish/ProCamStudio.exe -ArgumentList "--selftest","testdata" `
                 -WorkingDirectory publish -Wait -PassThru
          Get-Content publish/selftest-report.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen ($($p.ExitCode))" }

      - name: Virtual camera end-to-end (DirectShow, Windows 10 path)
        env:
          PROCAM_VCAM: dshow
        run: |
          $dll = (Resolve-Path publish/procam_vcam.dll).Path
          $r = Start-Process regsvr32.exe -ArgumentList "/s", "`"$dll`"" -Wait -PassThru
          if ($r.ExitCode -ne 0) { throw "regsvr32 fehlgeschlagen ($($r.ExitCode))" }

          # Feed the camera for 40 s from the app, grab frames with ffmpeg via DirectShow.
          $app = Start-Process -FilePath publish/ProCamStudio.exe -ArgumentList "--selftest","testdata","--vcam","40" `
                   -WorkingDirectory publish -PassThru
          Start-Sleep -Seconds 8
          & ffmpeg-bin/ffmpeg.exe -hide_banner -list_devices true -f dshow -i dummy 2>&1 | Out-String | Write-Host
          & ffmpeg-bin/ffmpeg.exe -hide_banner -y -f dshow -i video="ProCam iPhone" -frames:v 30 -update 1 vcam.png 2>&1 | Out-String | Write-Host
          $app.WaitForExit()
          Get-Content publish/selftest-report.txt
          if (-not (Test-Path vcam.png)) { throw "Kein Bild von der virtuellen Kamera erhalten" }

          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Bitmap]::FromFile((Resolve-Path vcam.png).Path)
          Write-Host "Webcam-Bild: $($img.Width)x$($img.Height)"
          $checks = @(
            @{ n = "rot";  x = 480;  y = 270; r = 220; g = 30;  b = 30 },
            @{ n = "grün"; x = 1440; y = 270; r = 30;  g = 200; b = 30 },
            @{ n = "blau"; x = 480;  y = 810; r = 30;  g = 40;  b = 220 },
            @{ n = "grau"; x = 1440; y = 810; r = 128; g = 128; b = 128 }
          )
          $bad = 0
          foreach ($c in $checks) {
            $px = $img.GetPixel($c.x, $c.y)
            $d = [Math]::Max([Math]::Abs($px.R - $c.r), [Math]::Max([Math]::Abs($px.G - $c.g), [Math]::Abs($px.B - $c.b)))
            Write-Host ("{0}: RGB({1},{2},{3}) Abweichung {4}" -f $c.n, $px.R, $px.G, $px.B, $d)
            if ($d -gt 30) { $bad++ }
          }
          $w = $img.Width; $h = $img.Height
          $img.Dispose()
          if ($w -ne 1920 -or $h -ne 1080) { throw "Falsche Größe ${w}x${h}" }
          if ($bad -gt 0) { throw "$bad Farben falsch – Bild verdreht oder verfälscht?" }
          if ($app.ExitCode -ne 0) { throw "Selbsttest mit Webcam fehlgeschlagen ($($app.ExitCode))" }
          Start-Process regsvr32.exe -ArgumentList "/u", "/s", "`"$dll`"" -Wait

      - name: Virtual camera end-to-end (Media Foundation, Windows 11 path)
        env:
          PROCAM_VCAM: mf
        run: |
          $setup = Start-Process -FilePath publish/ProCamStudio.exe -ArgumentList "--install-vcam" -WorkingDirectory publish -Wait -PassThru
          Get-Content (Join-Path $env:TEMP "procam-vcam-setup.log")
          if ($setup.ExitCode -ne 0) {
            # Server SKUs may lack the Frame Server / MFCreateVirtualCamera.
            Write-Host "::warning::Media-Foundation-Kamera auf diesem Runner nicht einrichtbar (Code $($setup.ExitCode)) - nicht getestet"
            exit 0
          }
          Get-Service FrameServer, FrameServerMonitor -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
          $app = Start-Process -FilePath publish/ProCamStudio.exe -ArgumentList "--selftest","testdata","--vcam","45" `
                   -WorkingDirectory publish -PassThru
          Start-Sleep -Seconds 6
          & ffmpeg-bin/ffmpeg.exe -hide_banner -list_devices true -f dshow -i dummy 2>&1 | Out-String | Write-Host
          # Grab a frame through Windows' DirectShow bridge; retry while the
          # Frame Server loads the source and Studio opens the section.
          for ($i = 0; $i -lt 4 -and -not (Test-Path mfcam.png); $i++) {
            & ffmpeg-bin/ffmpeg.exe -hide_banner -y -f dshow -i video="ProCam iPhone" -frames:v 60 -update 1 mfcam.png 2>&1 | Out-String | Write-Host
            Start-Sleep -Seconds 2
          }
          $app.WaitForExit()
          Get-Content publish/selftest-report.txt
          if (-not (Test-Path mfcam.png)) { throw "Kein Bild von der Media-Foundation-Kamera" }
          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Bitmap]::FromFile((Resolve-Path mfcam.png).Path)
          $w = $img.Width; $h = $img.Height
          $px = $img.GetPixel([int]($w / 4), [int]($h / 4)); $px2 = $img.GetPixel([int]($w * 3 / 4), [int]($h * 3 / 4))
          $img.Dispose()
          Write-Host "MF-Kamera: ${w}x${h}, oben links RGB($($px.R),$($px.G),$($px.B)), unten rechts RGB($($px2.R),$($px2.G),$($px2.B))"
          if ($px.R -lt 180 -or $px.G -gt 70 -or $px2.R -lt 100 -or $px2.R -gt 160) { throw "Farben falsch - Platzhalter statt iPhone-Bild?" }
          Start-Process -FilePath publish/ProCamStudio.exe -ArgumentList "--uninstall-vcam" -WorkingDirectory publish -Wait

      - name: UI with a simulated iPhone
        # Windows PowerShell 5.1: its .NET Framework has System.Drawing built in.
        shell: powershell
        run: |
          # Fake phone replays the recorded stream on port 47800; the Studio
          # connects to it, then the window is captured with PrintWindow
          # (works even where the window is larger than the runner's screen).
          $phone = Start-Process -FilePath publish/ProCamStudio.exe -ArgumentList "--fakephone","testdata","45" `
                     -WorkingDirectory publish -PassThru
          Start-Sleep -Seconds 2
          $app = Start-Process -FilePath publish/ProCamStudio.exe -ArgumentList "--connect","127.0.0.1" `
                   -WorkingDirectory publish -PassThru
          Start-Sleep -Seconds 18
          if ($app.HasExited) { throw "App hat sich beendet (Code $($app.ExitCode))" }
          $app.Refresh()
          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition @'
          using System; using System.Drawing; using System.Runtime.InteropServices;
          public static class Shot {
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] static extern bool PrintWindow(IntPtr h, IntPtr hdc, uint flags);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            public static void Save(IntPtr h, string path) {
              RECT r; GetWindowRect(h, out r);
              using (var bmp = new Bitmap(r.R - r.L, r.B - r.T)) {
                using (var g = Graphics.FromImage(bmp)) { var dc = g.GetHdc(); PrintWindow(h, dc, 2); g.ReleaseHdc(dc); }
                bmp.Save(path);
              }
            }
          }
          '@
          [Shot]::Save($app.MainWindowHandle, (Join-Path $PWD "ui.png"))
          Stop-Process -Id $app.Id
          $phone.WaitForExit()
          $log = Get-Content publish/fakephone-commands.txt -Raw
          Write-Host $log.Substring(0, [Math]::Min(1500, $log.Length))
          $errs = Join-Path $env:APPDATA "ProCam/errors.log"
          if (Test-Path $errs) { Get-Content $errs; throw "errors.log ist nicht leer" }
          if ($log -notmatch '"apply"') { throw "Studio hat keine Einstellungen an das Test-iPhone geschickt" }

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            vcam.png
            mfcam.png
            ui.png
        if: always()

      - name: Package
        run: |
          Remove-Item -Recurse -Force publish/testdata, publish/selftest-report.txt, publish/fakephone-commands.txt -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath ProCamStudio-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ProCamStudio-Windows
          path: ProCamStudio-Windows.zip
